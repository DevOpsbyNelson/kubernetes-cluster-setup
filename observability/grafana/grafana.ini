[server]
protocol = http
domain = $__env{GF_SERVER_ROOT_URL} # https://yourdomain.com/
root_url = $__env{GF_SERVER_ROOT_URL}/ # https://yourdomain.com/
serve_from_sub_path = false

[auth]
disable_login_form = $__env{GF_AUTH_DISABLE_LOGIN_FORM} # true or false

[auth.github]
enabled = true
allow_sign_up = true
auto_login = false
client_id = $__env{GF_AUTH_GITHUB_CLIENT_ID}
client_secret = $__env{GF_AUTH_GITHUB_CLIENT_SECRET}
allowed_organizations = $__env{GF_AUTH_GITHUB_ORG}
scopes = user:email,read:org
# Evaluated against the GitHub user (/user) and, as a fallback, against
# {"groups": [<teams as @org/team>]} — GitHub org roles are NOT available.
# allowed_organizations already limits sign-in to org members, so every member
# is at least Editor (Explore, i.e. traces/logs, needs Editor); members of the
# @DevOpsbyNelson/admins team are Admin. JMESPath strings need the single
# quotes. Re-synced on every login.
role_attribute_path = contains(groups[*], '@DevOpsbyNelson/admins') && 'Admin' || 'Editor'
role_attribute_strict = false