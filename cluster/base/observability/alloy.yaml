# Receives traces and logs from the service over OTLP, samples traces, and forwards them to Tempo
# and Loki (observability/alloy/config.alloy).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alloy
  namespace: observability
  labels:
    app.kubernetes.io/name: alloy
spec:
  # Tail sampling needs every span of a trace on the same instance: keep one replica.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: alloy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alloy
    spec:
      containers:
        - name: alloy
          image: eks-cluster/alloy
          ports:
            - name: http
              containerPort: 12345
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
          env:
            - name: ALLOY_TEMPO_OTLP_ENDPOINT
              value: http://tempo:4318
            - name: ALLOY_LOKI_URL
              value: http://loki:3100/loki/api/v1/push
            # Percentage of normal traces kept; errors and slow traces are always kept.
            - name: ALLOY_SAMPLE_RATE
              value: "100"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/alloy/data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: alloy
  namespace: observability
  labels:
    app.kubernetes.io/name: alloy
spec:
  selector:
    app.kubernetes.io/name: alloy
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
    - name: http
      port: 12345
      targetPort: http
