# Dashboards and data sources (observability/grafana/). Reached with kubectl port-forward on
# localhost:3000, so that is its root URL. The grafana Secret is created by the deploy job.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: grafana
  namespace: observability
  labels:
    app.kubernetes.io/name: grafana
spec:
  serviceName: grafana
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 0
        fsGroup: 472
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: grafana
          image: eks-cluster/grafana
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: GF_SERVER_ROOT_URL
              value: http://localhost:3000
            - name: GF_AUTH_DISABLE_LOGIN_FORM
              value: "false"
            - name: GF_AUTH_GITHUB_ORG
              value: DevOpsbyNelson
          # GF_SECURITY_ADMIN_PASSWORD, GF_AUTH_GITHUB_ENABLED, GF_AUTH_GITHUB_CLIENT_ID and
          # GF_AUTH_GITHUB_CLIENT_SECRET.
          envFrom:
            - secretRef:
                name: grafana
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
          # Users, preferences and dashboards saved from the UI.
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: observability
  labels:
    app.kubernetes.io/name: grafana
spec:
  selector:
    app.kubernetes.io/name: grafana
  ports:
    - name: http
      port: 3000
      targetPort: http
