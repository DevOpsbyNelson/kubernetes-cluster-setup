# Runs everything on a local Kubernetes (Docker Desktop or minikube), for trying changes on your machine.
# Deployed by cluster/local.sh: directly with kubectl (`up`), or by a local Argo CD (`argocd`).
# Never by the workflows.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# Images built on this machine by cluster/local.sh (and loaded into minikube's runtime when
# deploying there), so nothing is pulled from ECR.
images:
  - name: eks-cluster/service
    newName: local/service
    newTag: dev
  - name: eks-cluster/alertmanager
    newName: local/alertmanager
    newTag: dev
  - name: eks-cluster/alloy
    newName: local/alloy
    newTag: dev
  - name: eks-cluster/grafana
    newName: local/grafana
    newTag: dev
  - name: eks-cluster/loki
    newName: local/loki
    newTag: dev
  - name: eks-cluster/prometheus
    newName: local/prometheus
    newTag: dev
  - name: eks-cluster/tempo
    newName: local/tempo
    newTag: dev

patches:
  # No EBS here: the volumes use the cluster's default storage class (hostpath on Docker Desktop,
# standard on minikube).
  - patch: |-
      $patch: delete
      apiVersion: storage.k8s.io/v1
      kind: StorageClass
      metadata:
        name: gp3

  # Docker Desktop publishes a LoadBalancer Service on localhost (minikube needs `minikube tunnel`).
  # Port 8080 instead of 80, which is often taken on a laptop. The AWS annotation is meaningless here.
  - target:
      kind: Service
      name: service-public
    patch: |-
      - op: replace
        path: /spec/ports/0/port
        value: 8080
      - op: remove
        path: /metadata/annotations

  # Only the images built by cluster/local.sh exist: never try to pull them.
  - target:
      kind: Deployment|StatefulSet
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never

  # Smaller volumes: they live on your machine's disk.
  - target:
      kind: StatefulSet
      name: prometheus|loki|tempo
    patch: |-
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage
        value: 2Gi
